version: "3.9"

# Production-style local stack: MongoDB + backend API (Express/Puppeteer) + frontend (Next.js).
# Usage:
#   cp backend/.env.example backend/.env      # adjust if needed
#   docker compose up --build
# Frontend: http://localhost:3000  |  Backend health check: http://localhost:5000/api/health

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/invoice_app
      FRONTEND_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 300
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:5000
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "3000:3000"

volumes:
  mongo_data:
